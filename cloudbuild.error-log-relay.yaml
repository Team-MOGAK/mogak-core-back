steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - apps/alerting/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}

substitutions:
  _AR_REPOSITORY: REPLACE_WITH_ARTIFACT_REGISTRY_REPOSITORY
  _REGION: asia-northeast3
  _IMAGE_NAME: error-log-relay
  _IMAGE_TAG: REPLACE_WITH_IMAGE_TAG

options:
  logging: CLOUD_LOGGING_ONLY
