---
timeout: 1200s

substitutions:
  _REGION: __SET_IN_TRIGGER__
  _AR_REPOSITORY: __SET_IN_TRIGGER__
  _IMAGE_NAME: mogak-core-back
  _SERVICE: __SET_IN_TRIGGER__
  _RUNTIME_SERVICE_ACCOUNT: __SET_IN_TRIGGER__

steps:
  - id: validate-target
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:d4d7a9a1e3d824db170e56764d5bfe39d9f23924cd51505e0792d360cbed209c  # yamllint disable-line rule:line-length
    entrypoint: bash
    args:
      - -ceu
      - |
        test "${_REGION}" != "__SET_IN_TRIGGER__"
        test -n "${_REGION}"
        test "${_AR_REPOSITORY}" != "__SET_IN_TRIGGER__"
        test -n "${_AR_REPOSITORY}"
        test "${_SERVICE}" != "__SET_IN_TRIGGER__"
        test -n "${_SERVICE}"
        test "${_RUNTIME_SERVICE_ACCOUNT}" != "__SET_IN_TRIGGER__"
        test -n "${_RUNTIME_SERVICE_ACCOUNT}"
        test -n "${COMMIT_SHA}"
        test -n "${SHORT_SHA}"

        gcloud artifacts repositories describe "${_AR_REPOSITORY}" \
          --location="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format='value(name)' >/dev/null
        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --project="${PROJECT_ID}" \
          --format='value(metadata.name)' >/dev/null
        gcloud iam service-accounts describe "${_RUNTIME_SERVICE_ACCOUNT}" \
          --project="${PROJECT_ID}" \
          --format='value(email)' >/dev/null

  - id: build-app
    name: gcr.io/cloud-builders/docker@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311  # yamllint disable-line rule:line-length
    waitFor: [validate-target]
    args:
      - build
      - --target
      - runtime
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}
      - .

  - id: push-app
    name: gcr.io/cloud-builders/docker@sha256:d1797996867921778f1adbb7e493baaaf2f6b21e107599c0aab48c2ec06ff311  # yamllint disable-line rule:line-length
    waitFor: [build-app]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}

  - id: resolve-app-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:d4d7a9a1e3d824db170e56764d5bfe39d9f23924cd51505e0792d360cbed209c  # yamllint disable-line rule:line-length
    waitFor: [push-app]
    entrypoint: bash
    args:
      - -ceu
      - |
        app_image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${COMMIT_SHA}"
        digest="$$(gcloud artifacts docker images describe "$$app_image" \
          --project="${PROJECT_ID}" \
          --format='value(image_summary.digest)')"
        test -n "$$digest"
        printf '%s\n' "$$digest" > /workspace/app-digest

  - id: deploy-no-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:d4d7a9a1e3d824db170e56764d5bfe39d9f23924cd51505e0792d360cbed209c  # yamllint disable-line rule:line-length
    waitFor: [resolve-app-digest]
    entrypoint: bash
    args:
      - -ceu
      - |
        app_image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}"
        digest="$$(cat /workspace/app-digest)"
        build_id="${BUILD_ID}"
        tag="verify-${SHORT_SHA}-$${build_id:0:8}"
        revision="$$(gcloud run deploy "${_SERVICE}" \
          --project="${PROJECT_ID}" \
          --image="$$app_image@$$digest" \
          --region="${_REGION}" \
          --no-traffic \
          --tag="$$tag" \
          --service-account="${_RUNTIME_SERVICE_ACCOUNT}" \
          --format='value(status.latestCreatedRevisionName)' \
          --quiet)"
        test -n "$$revision"

        service_url="$$(gcloud run services describe "${_SERVICE}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --format='value(status.url)')"
        test -n "$$service_url"
        service_host="$${service_url#https://}"
        smoke_url="https://$$tag---$$service_host"
        printf '%s\n' "$$service_url" > /workspace/service-url
        printf '%s\n' "$$smoke_url" > /workspace/smoke-url
        printf '%s\n' "$$revision" > /workspace/revision
        printf 'CLOUD_RUN_SERVICE=%s\n' "${_SERVICE}"
        printf 'CLOUD_RUN_REGION=%s\n' "${_REGION}"
        printf 'CLOUD_RUN_IMAGE=%s@%s\n' "$$app_image" "$$digest"
        printf 'CLOUD_RUN_REVISION=%s\n' "$$revision"
        printf 'CLOUD_RUN_TAG=%s\n' "$$tag"
        printf 'CLOUD_RUN_SMOKE_URL=%s\n' "$$smoke_url/health"

  - id: smoke-no-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:d4d7a9a1e3d824db170e56764d5bfe39d9f23924cd51505e0792d360cbed209c  # yamllint disable-line rule:line-length
    waitFor: [deploy-no-traffic]
    entrypoint: bash
    args:
      - -ceu
      - |
        service_url="$$(cat /workspace/service-url)"
        smoke_url="$$(cat /workspace/smoke-url)"
        token="$$(gcloud auth print-identity-token --audiences="$$service_url")"
        response="$$(curl \
          --fail --silent --show-error \
          --retry 5 --retry-delay 2 --retry-connrefused \
          --connect-timeout 5 --max-time 20 \
          --header "Authorization: Bearer $$token" "$$smoke_url/health")"
        test "$$response" = '{"status":"ok"}'

options:
  logging: CLOUD_LOGGING_ONLY
